name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint
        run: flake8 .

      - name: Test
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-demo:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-python-demo:${{ github.sha }}

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev

    steps:
      - name: Deploy to DEV
        run: echo "DEV deployment stage"

      - name: DEV health check
        run: echo "DEV health check passed"

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Deploy to STAGING
        run: echo "STAGING deployment stage"

      - name: STAGING health check
        run: echo "STAGING health check passed"

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
      - name: Deploy to PROD
        run: echo "PROD deployment stage"

      - name: PROD health check
        run: echo "PROD health check passed"

  rollback:
    needs: deploy-prod
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Rollback deployment
        run: echo "Rolling back to previous stable version..."
